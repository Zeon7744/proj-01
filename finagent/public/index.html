<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinAgent · 全球金融数据智能分析 Agent</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <aside class="sidenav">
    <div class="brand">Fin<span>Agent</span></div>
    <nav>
      <button class="nav-item active" data-page="dashboard">概览</button>
      <button class="nav-item" data-page="data">行情数据</button>
      <button class="nav-item" data-page="analysis">分析</button>
      <button class="nav-item" data-page="prediction">预测 & 命中</button>
      <button class="nav-item" data-page="openapi">开放 API</button>
    </nav>
    <div class="sidenav-foot">
      <label class="muted">角色（权限隔离）</label>
      <select id="roleSelect">
        <option value="admin">admin (fa_admin)</option>
        <option value="analyst">analyst (fa_analyst_7f3a)</option>
        <option value="viewer">viewer (fa_viewer_1c9d)</option>
      </select>
      <div class="version-toggle" id="versionToggle">
        <button class="vbtn active" data-v="full">完整版</button>
        <button class="vbtn" data-v="lite">简版</button>
      </div>
    </div>
  </aside>

  <main class="content">
    <header class="topbar">
      <h1 id="pageTitle">概览</h1>
      <div class="topbar-actions">
        <button id="collectBtn" class="btn btn-primary">运行采集</button>
        <button id="refreshBtn" class="btn">刷新</button>
        <span class="pill" id="lastRun">尚未运行</span>
      </div>
    </header>

    <section id="page-dashboard" class="page active">
      <div class="stat-grid" id="statGrid"></div>
      <div class="panel">
        <h2>资产总览</h2>
        <div id="dashList" class="dash-list"></div>
      </div>
    </section>

    <section id="page-data" class="page">
      <div class="panel">
        <h2>行情数据</h2>
        <div id="dataList"></div>
      </div>
    </section>

    <section id="page-analysis" class="page">
      <div class="panel">
        <h2>技术指标分析</h2>
        <div id="analysisList"></div>
      </div>
    </section>

    <section id="page-prediction" class="page">
      <div class="panel">
        <h2>预测 & 命中检测（完整版）</h2>
        <div id="predList"></div>
      </div>
    </section>

    <section id="page-openapi" class="page">
      <div class="panel">
        <h2>应用开放 API</h2>
        <div id="openapiDoc"></div>
      </div>
    </section>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
